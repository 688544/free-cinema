<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Res سينما | MovieBox</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        body { background-color: #0f0f0f; color: #fff; padding-bottom: 20px; }
        
        /* Header & Search */
        header { background: #1a1a1a; padding: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .logo { font-size: 20px; font-weight: bold; color: #e50914; margin-bottom: 10px; text-align: center; }
        .search-box { display: flex; gap: 8px; }
        input { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #333; background: #252525; color: #fff; outline: none; }
        button { padding: 10px 18px; border-radius: 20px; border: none; background: #e50914; color: #fff; font-weight: bold; cursor: pointer; }
        
        /* Movie Grid */
        .container { padding: 15px; }
        .section-title { font-size: 16px; margin-bottom: 12px; color: #aaa; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
        .card { background: #1c1c1c; border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .card-info { padding: 8px; font-size: 12px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Fullscreen Player Modal */
        #player-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 1000; flex-direction: column; }
        .player-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #111; }
        .close-btn { color: #e50914; font-weight: bold; cursor: pointer; font-size: 16px; }
        #video-frame { width: 100%; height: 100%; border: none; flex: 1; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎬 Res سينما</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل...">
            <button onclick="searchMovie()">بحث</button>
        </div>
    </header>

    <div class="container">
        <div class="section-title" id="gridTitle">الأفلام الأكثر شائعة</div>
        <div class="grid" id="movieGrid"></div>
    </div>

    <!-- Player Modal -->
    <div id="player-modal">
        <div class="player-header">
            <span id="playingTitle">مشاهدة الفيلم</span>
            <span class="close-btn" onclick="closePlayer()">✕ إغلاق</span>
        </div>
        <iframe id="video-frame" src="" allowfullscreen></iframe>
    </div>

    <script>
        const OMDB_API_KEY = "353460b"; // مفتاح OMDb الخاص بك

        // جلب أفلام افتراضية عند التشهيل
        window.onload = () => {
            fetchMovies("Avengers");
        };

        async function searchMovie() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                document.getElementById('gridTitle').innerText = `نتائج البحث عن: ${query}`;
                fetchMovies(query);
            }
        }

        async function fetchMovies(query) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = "<p>جاري التحميل...</p>";
            try {
                const res = await fetch(`https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&s=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                if (data.Response === "True") {
                    grid.innerHTML = "";
                    data.Search.forEach(item => {
                        if (item.Poster !== "N/A") {
                            const card = document.createElement('div');
                            card.className = 'card';
                            card.innerHTML = `
                                <img src="${item.Poster}" alt="${item.Title}">
                                <div class="card-info">${item.Title}</div>
                            `;
                            card.onclick = () => openPlayer(item.imdbID, item.Title);
                            grid.appendChild(card);
                        }
                    });
                } else {
                    grid.innerHTML = "<p>لم يتم العثور على نتائج.</p>";
                }
            } catch (err) {
                grid.innerHTML = "<p>حدث خطأ أثناء جلب البيانات.</p>";
            }
        }

        function openPlayer(imdbId, title) {
            document.getElementById('playingTitle').innerText = title;
            // استخدام vidsrc كمحرك تشغيل مباشر يعتمد على imdbID
            document.getElementById('video-frame').src = `https://vidsrc.to/embed/movie/${imdbId}`;
            document.getElementById('player-modal').style.display = "flex";
        }

        function closePlayer() {
            document.getElementById('video-frame').src = "";
            document.getElementById('player-modal').style.display = "none";
        }

        // تسجيل الـ Service Worker لتمكين الـ PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>
</html>
